name: Sync official Tine
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-official-tine
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'EllisMorrow/tine'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge official master into fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/EllisMorrow/tine/merge-upstream -f branch=master
